<script>
/* PWA plumbing — runs before React so we never miss Chrome's install event */
window.__swInstallEvent = null;
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  window.__swInstallEvent = e;
  window.dispatchEvent(new Event("sw-install-ready"));
});
window.addEventListener("appinstalled", function(){
  window.__swInstallEvent = null;
  window.dispatchEvent(new Event("sw-installed"));
});
// Ask Chrome not to evict our saved data when storage is low (auto-granted for installed apps)
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
// Offline support
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>

<style>
:root{
  --ink:#151c33;
  --ink-soft:#3c4566;
  --paper:#f2f4f3;
  --panel:#ffffff;
  --line:#dfe3e6;
  --navy:#151c33;
  --navy-2:#232c4d;
  --marigold:#e8a13d;
  --marigold-deep:#c9821f;
  --teal:#1f7a6c;
  --teal-soft:#e4f2ee;
  --coral:#d5573b;
  --coral-soft:#fbe7e2;
  --green:#2f8f5b;
  --green-soft:#e5f4ea;
  --gray:#8890a3;
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:26px;
  --shadow:0 1px 2px rgba(21,28,51,0.06), 0 8px 24px -12px rgba(21,28,51,0.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Manrope',sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:'Fraunces',serif;}
#root{min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--marigold);color:var(--navy);}

/* ---------- utility ---------- */
.container{max-width:1180px;margin:0 auto;padding:0 28px;}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  border:none;border-radius:999px;padding:13px 26px;
  font-weight:700;font-size:15px;letter-spacing:0.01em;
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease, color .18s ease;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--marigold);color:var(--navy);box-shadow:0 10px 24px -10px rgba(232,161,61,0.65);}
.btn-primary:hover{background:var(--marigold-deep);box-shadow:0 14px 28px -10px rgba(232,161,61,0.75);}
.btn-dark{background:var(--navy);color:#fff;}
.btn-dark:hover{background:var(--navy-2);}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--ink);}
.btn-sm{padding:8px 16px;font-size:13px;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-m);transition:border-color .2s ease, box-shadow .2s ease;}
.muted{color:var(--ink-soft);}
.faint{color:var(--gray);}
.progress-track{background:#e9ebe9;border-radius:999px;overflow:hidden;height:9px;}
.progress-fill{height:100%;border-radius:999px;transition:width .55s cubic-bezier(.22,.9,.32,1);}
.scrollbar-thin::-webkit-scrollbar{width:6px;height:6px;}
.scrollbar-thin::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;}

/* ---------- animation system ---------- */
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.anim-in{animation:fadeInUp .32s cubic-bezier(.22,.9,.32,1) both;}
@keyframes popCheck{0%{transform:scale(.82);}55%{transform:scale(1.16);}100%{transform:scale(1);}}
.pop{animation:popCheck .3s ease;}
@keyframes rowFlash{0%{background:var(--green-soft);}100%{background:transparent;}}
.row-flash{animation:rowFlash 1s ease;}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.toast-in{animation:toastIn .28s cubic-bezier(.22,.9,.32,1) both;}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(232,161,61,.45);}100%{box-shadow:0 0 0 13px rgba(232,161,61,0);}}
.timer-live{animation:ringPulse 1.8s ease-out infinite;}
@keyframes focusGlow{0%{box-shadow:0 0 0 0 rgba(213,87,59,.35);}70%{box-shadow:0 0 0 9px rgba(213,87,59,0);}100%{box-shadow:0 0 0 0 rgba(213,87,59,0);}}
.focus-glow{animation:focusGlow .7s ease;}
input[type=checkbox]{transition:transform .18s ease;}

/* ---------- touch basics ---------- */
html{-webkit-text-size-adjust:100%;}
button,.btn,label.btn{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}

/* ---------- phone layout (<= 820px): sidebar becomes a compact top bar ---------- */
@media (max-width: 820px){
  html,body{overflow-x:hidden;}
  .sw-shell{flex-direction:column !important;}
  .sw-side{width:100% !important;height:auto !important;position:sticky !important;top:0;z-index:40;flex-direction:row !important;flex-wrap:wrap;align-items:center;padding:10px 12px 6px !important;gap:8px !important;}
  .sw-brand{flex:1 1 auto;}
  .sw-search{order:2;padding:8px 12px !important;}
  .sw-cd{order:3;margin-top:0 !important;padding:6px 10px !important;}
  .sw-cd-n{font-size:15px !important;}
  .sw-nav{order:4;flex:0 0 100%;flex-direction:row !important;overflow-x:auto;gap:4px !important;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .sw-nav::-webkit-scrollbar{display:none;}
  .sw-nav button{flex:0 0 auto;white-space:nowrap;padding:8px 12px !important;font-size:13px !important;}
  .sw-focus,.sw-hide-m{display:none !important;}
  .sw-main{width:100%;}
  .container{padding:0 14px;}
  .sw-pagehead{padding:22px 14px 14px !important;gap:12px !important;}
  .sw-h1{font-size:24px !important;}
  img,canvas,svg{max-width:100%;}

  /* iOS zooms into any field under 16px; inline sizes need !important to lose */
  input,select,textarea{font-size:16px !important;}
  .btn-sm{padding:9px 14px;min-height:38px;}
  .sw-check{width:22px !important;height:22px !important;flex:0 0 auto;}
  .sw-rate{width:32px !important;height:32px !important;font-size:13px !important;}
  .sw-custom{width:130px !important;}

  /* layout helpers */
  .sw-two{grid-template-columns:1fr !important;gap:16px !important;}
  .sw-notes-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr)) !important;}
  .sw-fform > select,.sw-fform > input[type=date]{flex:1 1 100%;min-width:0;}
  .sw-clock{font-size:46px !important;}
  .sw-toast{left:14px !important;right:14px !important;bottom:14px !important;max-width:none !important;text-align:center;}

  /* subject topic rows: text on top, buttons on their own line */
  .sw-trow{flex-wrap:wrap !important;}
  .sw-trow > div{flex:1 1 calc(100% - 36px) !important;}
  .sw-trow > button:first-of-type{margin-left:32px;}

  /* tables turn into stacked cards instead of sideways scrolling */
  .sw-table{display:block !important;overflow:visible !important;}
  .sw-table thead{display:none !important;}
  .sw-table tbody{display:block;}
  .sw-table tr{display:flex !important;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:12px 14px !important;}
  .sw-table td{display:block;padding:0 !important;text-align:left !important;font-size:13px;}
  .sw-table td.sw-full{flex:0 0 100%;}
  .sw-table td.sw-end{margin-left:auto;}
  .sw-table td.sw-o9{order:9;}
  .sw-lbl td[data-label]::before{content:attr(data-label) ": ";color:var(--gray);font-size:11.5px;font-weight:600;}
  .sw-lbl td.sw-end{margin-left:0;}

  /* landing page */
  .sw-float{display:none !important;}
  .sw-lnav{padding:18px 16px !important;}
  .sw-hero{padding:8px 16px 40px !important;gap:32px !important;min-height:0 !important;}
  .sw-lpill{border-radius:14px !important;line-height:1.45;}
  .sw-lbtns .btn{flex:1 1 100%;justify-content:center;}
  .sw-stats{gap:22px !important;}
  .sw-foot{gap:6px 16px !important;padding:0 16px;}

  .sw-setup{padding:14px !important;align-items:flex-start !important;}
  .sw-setup-card{padding:24px 18px !important;}
}
@media (max-width: 520px){
  .sw-notes-grid{grid-template-columns:1fr !important;}
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
}

/* =========================================================================
   2. SMART PRIORITY ENGINE
   ========================================================================= */
const REVISION_INTERVALS_DEFAULT = [3,7,15]; // days: rev1, rev2, final-revision trigger window

function daysSince(dateStr){
  if(!dateStr) return 999;
  return Math.floor((Date.now() - new Date(dateStr).getTime())/86400000);
}

function isRevisionDue(topic, intervals){
  if(!topic.completed) return false;
  if(topic.revisionStage>=3) return false;
  const lastAction = topic.lastRevised || topic.lastStudied;
  const gap = intervals[topic.revisionStage] ?? intervals[intervals.length-1];
  return daysSince(lastAction) >= gap;
}

// Core per-topic scoring. examFocus lets Exam Focus Mode boost one subject.
function calculatePriority(topic, subject, daysToExam, intervals, examFocus){
  const diffScore = topic.difficulty/3;
  const impScore = topic.importance/4;
  const weakness = (5 - subject.confidence)/4;
  const pending = topic.completed ? 0 : 1;
  const due = isRevisionDue(topic, intervals) ? 1 : (topic.completed ? 0.25 : 0.6);
  const staleness = Math.min(daysSince(topic.lastStudied||null)/30, 1);
  const examPressure = daysToExam!=null ? Math.max(0, Math.min(1,(180-daysToExam)/180)) : 0.3;

  let score = diffScore*22 + impScore*20 + weakness*16 + pending*18 + due*14 + staleness*6 + examPressure*4;

  const reasons=[];
  if(topic.difficulty===3) reasons.push("high difficulty");
  if(topic.importance>=3) reasons.push("high exam importance");
  if(!topic.completed) reasons.push("incomplete");
  if(isRevisionDue(topic,intervals)) reasons.push("revision overdue");
  if(weakness>0.5) reasons.push("your confidence here is low");
  if(daysSince(topic.lastStudied)>14 && topic.lastStudied) reasons.push("not studied recently");

  if(examFocus && examFocus.enabled && examFocus.subjectId===subject.id){
    score += examFocus.focusOnly ? 30 : 20;
    reasons.unshift("Exam Focus is active for " + subject.name);
  }
  score = Math.round(Math.min(99, Math.max(4, score)));
  if(reasons.length===0) reasons.push("keeps your syllabus balanced");

  const reason = "Recommended because " + reasons.slice(0,3).join(", ") + ".";
  const recommendedMinutes = Math.round(Math.min(90, Math.max(20, topic.estimatedMinutes * (0.6 + score/140))));

  return { score, reason, recommendedMinutes };
}

// Picks the single best actionable topic for one subject (used in comparisons).
function bestTopicForSubject(subject, daysToExam, intervals, examFocus){
  const candidates = subject.chapters.flatMap(c=>c.topics).filter(t=>!t.completed || isRevisionDue(t,intervals));
  const pool = candidates.length ? candidates : subject.chapters.flatMap(c=>c.topics);
  let best=null, bestScore=-1;
  pool.forEach(t=>{ const {score}=calculatePriority(t,subject,daysToExam,intervals,examFocus); if(score>bestScore){bestScore=score;best=t;} });
  if(!best) return null;
  return { topic:best, ...calculatePriority(best,subject,daysToExam,intervals,examFocus) };
}

// Fills `remainingMinutes` of study time with the best remaining topics,
// respecting anything already excluded (manually chosen or dismissed) and
// respecting Exam Focus Mode (restricts the whole pool when "focus only").
function computeAutoFill(allSubjects, excludeIds, remainingMinutes, daysToExam, intervals, examFocus){
  if(remainingMinutes<=0) return [];
  const candidateSubjects = (examFocus && examFocus.enabled && examFocus.focusOnly)
    ? allSubjects.filter(s=>s.id===examFocus.subjectId)
    : allSubjects;

  let pool=[];
  candidateSubjects.forEach(s=>{
    s.chapters.forEach(c=>{
      c.topics.forEach(t=>{
        if(excludeIds.has(t.id)) return;
        if(t.completed && !isRevisionDue(t,intervals)) return;
        const {score,reason,recommendedMinutes} = calculatePriority(t,s,daysToExam,intervals,examFocus);
        pool.push({topic:t, subject:s, score, reason, recommendedMinutes});
      });
    });
  });
  pool.sort((a,b)=>b.score-a.score);

  const picks=[]; let used=0; const seenSubjects=new Set();
  for(const p of pool){
    if(used>=remainingMinutes) break;
    if(seenSubjects.has(p.subject.id)) continue;
    const minutes = Math.min(p.recommendedMinutes, remainingMinutes-used);
    if(minutes<10) continue;
    picks.push({...p, minutes, source:"auto"});
    used+=minutes; seenSubjects.add(p.subject.id);
  }
  for(const p of pool){
    if(used>=remainingMinutes) break;
    if(picks.find(pp=>pp.topic.id===p.topic.id)) continue;
    const minutes = Math.min(p.recommendedMinutes, remainingMinutes-used);
    if(minutes<10) continue;
    picks.push({...p, minutes, source:"auto"});
    used+=minutes;
  }
  return picks.sort((a,b)=>b.score-a.score);
}

/* =========================================================================
   3. APP CONTEXT / MULTI-PROFILE STATE
   Each student is kept in an isolated "bucket" inside profilesStore, keyed
   by their name. A brand-new name always starts at buildInitialSubjects()
   (0% everywhere, 0 minutes, 0 sessions) — see req. #5/#6. The "Demo
   Student" bucket is the only one seeded with sample data, purely so the
   landing page's "See a live demo" link has something to show.

   PERSISTENCE: profilesStore + currentKey are saved to localStorage under
   STORAGE_KEY (see 3a below) and restored on start. The same envelope is
   used for the Export / Import Backup file, so one code path validates both.
   ========================================================================= */
/* ---- 3a. PERSISTENCE + BACKUP HELPERS (pure functions, no React) ---- */
const STORAGE_KEY = "studywise_backup_v1";
const LAST_EXPORT_KEY = "studywise_last_export";
const BACKUP_APP = "StudyWise";
const BACKUP_VERSION = 1;
// To support a future format: bump BACKUP_VERSION and add a migration that
// upgrades version N -> N+1, e.g. BACKUP_MIGRATIONS[1] = d => ({...d, version:2, ...}).
// Older backups are then upgraded step by step on import/load.
const BACKUP_MIGRATIONS = {};

const isPlainObj = v => v !== null && typeof v === "object" && !Array.isArray(v);
const hasOwn = (o,k) => Object.prototype.hasOwnProperty.call(o,k);
function cleanMap(v, check){
  const out = {};
  if(!isPlainObj(v)) return out;
  Object.keys(v).forEach(k=>{ if(k!=="__proto__" && check(v[k])) out[k] = v[k]; });
  return out;
}

// Validates one profile and fills any missing property from current defaults.
// Returns null if the profile is structurally unusable.
function normalizeBucket(raw, fallbackName, def, subjMap, topicMap){
  if(!isPlainObj(raw) || !Array.isArray(raw.subjects) || !raw.subjects.length) return null;
  for(const sub of raw.subjects){
    if(!isPlainObj(sub) || typeof sub.id!=="string" || !Array.isArray(sub.chapters)) return null;
    for(const ch of sub.chapters){
      if(!isPlainObj(ch) || !Array.isArray(ch.topics)) return null;
      for(const t of ch.topics){ if(!isPlainObj(t) || typeof t.id!=="string") return null; }
    }
  }
  const dailyManual = cleanMap(raw.dailyManual, Array.isArray);
  Object.keys(dailyManual).forEach(k=>{ dailyManual[k] = dailyManual[k].filter(isPlainObj); });
  return {
    ...def, ...raw,
    displayName: (typeof raw.displayName==="string" && raw.displayName.trim()) ? raw.displayName : fallbackName,
    subjects: raw.subjects.map(sub=>({
      ...(subjMap[sub.id]||{}), ...sub,
      chapters: sub.chapters.map(ch=>({...ch, topics: ch.topics.map(t=>({...(topicMap[t.id]||{}), ...t}))})),
    })),
    sessions: Array.isArray(raw.sessions) ? raw.sessions.filter(isPlainObj) : [],
    dailyMinutesDefault: Number.isFinite(raw.dailyMinutesDefault) ? raw.dailyMinutesDefault : def.dailyMinutesDefault,
    examDate: typeof raw.examDate==="string" ? raw.examDate : def.examDate,
    dailyTime: cleanMap(raw.dailyTime, Number.isFinite),
    dailyManual,
    dismissedAuto: cleanMap(raw.dismissedAuto, Array.isArray),
    autoFillOn: cleanMap(raw.autoFillOn, v=>typeof v==="boolean"),
    examFocus: {...def.examFocus, ...(isPlainObj(raw.examFocus) ? raw.examFocus : {})},
  };
}

// strict=true (import): any bad profile rejects the whole file.
// strict=false (startup load): bad profiles are skipped, good ones are kept.
function normalizeStore(rawStore, strict){
  if(!isPlainObj(rawStore)) return null;
  const def = newProfileBucket("Guest", false);
  const subjMap = {}, topicMap = {};
  def.subjects.forEach(sub=>{ subjMap[sub.id]=sub; sub.chapters.forEach(c=>c.topics.forEach(t=>{ topicMap[t.id]=t; })); });
  const out = {};
  for(const k of Object.keys(rawStore)){
    if(k==="__proto__") continue;
    const nb = normalizeBucket(rawStore[k], k, def, subjMap, topicMap);
    if(nb) out[k] = nb; else if(strict) return null;
  }
  return Object.keys(out).length ? out : null;
}

// Validates a parsed backup/storage envelope. Never throws, never mutates app state.
function parseBackup(data, strict){
  if(!isPlainObj(data) || data.app!==BACKUP_APP) return {ok:false, error:"notbackup"};
  let cur = data, v = data.version;
  if(!Number.isInteger(v) || v<1) return {ok:false, error:"badversion"};
  if(v>BACKUP_VERSION) return {ok:false, error:"newer"};
  while(v<BACKUP_VERSION){
    const migrate = BACKUP_MIGRATIONS[v];
    if(!migrate) return {ok:false, error:"badversion"};
    cur = migrate(cur);
    if(!isPlainObj(cur) || !Number.isInteger(cur.version) || cur.version<=v) return {ok:false, error:"badversion"};
    v = cur.version;
  }
  const store = normalizeStore(cur.profilesStore, strict);
  if(!store) return {ok:false, error:"nostore"};
  const key = (typeof cur.currentKey==="string" && hasOwn(store,cur.currentKey)) ? cur.currentKey : null;
  return {ok:true, profilesStore:store, currentKey:key};
}

function buildBackupPayload(profilesStore, currentKey, stampField){
  return {app:BACKUP_APP, version:BACKUP_VERSION, [stampField]:new Date().toISOString(), currentKey, profilesStore};
}

function readStorage(){
  let raw = null;
  try{
    raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const r = parseBackup(JSON.parse(raw), false);
    if(r.ok) return r;
  }catch(e){}
  // Unreadable data: keep a copy for recovery, then start from defaults.
  try{ if(raw) localStorage.setItem(STORAGE_KEY+"_corrupt", raw); }catch(e){}
  return null;
}

function writeStorage(profilesStore, currentKey){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(buildBackupPayload(profilesStore,currentKey,"savedAt")));
    return {ok:true};
  }catch(e){
    return {ok:false};
  }
}

function localDateStamp(){
  const d = new Date(), p = n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

function readFileText(file){
  if(file.text) return file.text();
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsText(file); });
}

function fileToDataURL(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(file); });
}
// Phone photos are often 3-8 MB; localStorage only holds ~5 MB in total. Downscale
// to max 1280px JPEG before storing. Falls back to the untouched original on any problem.
async function photoToDataURL(file){
  const src = await fileToDataURL(file);
  try{
    if(!/^image\/(jpe?g|png|webp)$/i.test(file.type)) return src;
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
    const scale = Math.min(1, 1280/Math.max(img.width,img.height));
    const c = document.createElement("canvas");
    c.width = Math.max(1,Math.round(img.width*scale)); c.height = Math.max(1,Math.round(img.height*scale));
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(img,0,0,c.width,c.height);
    const out = c.toDataURL("image/jpeg",0.8);
    return out.length < src.length ? out : src;
  }catch(e){ return src; }
}

    patchBucket(b=>({
      ...b,
      sessions:[{id:"sess-"+Date.now(), subjectId, topicName:`${topic.chapter} › ${topic.name}`, minutes, date:new Date().toISOString()}, ...b.sessions],
      subjects: b.subjects.map(s=>({...s, chapters: s.chapters.map(c=>({...c, topics:c.topics.map(t=> t.id===topic.id?{...t, completed:true, lastStudied:new Date().toISOString()}:t)}))}))
    }));
  },[patchBucket]);

  const setTodayMinutes = useCallback((mins)=>{
    patchBucket(b=>({...b, dailyTime:{...b.dailyTime,[todayKey]:mins}}));
    showToast(`Today's study time set to ${fmtHM(mins)}`);
  },[patchBucket,todayKey,showToast]);

  const addManualTopic = useCallback((topic, minutes)=>{
    let added=false;
    patchBucket(b=>{
      const list = b.dailyManual[todayKey]||[];
      if(list.find(m=>m.topicId===topic.id)) return b;
      added=true;
      const dismissed = (b.dismissedAuto[todayKey]||[]).filter(id=>id!==topic.id);
      return {...b, dailyManual:{...b.dailyManual, [todayKey]:[...list,{topicId:topic.id, minutes}]}, dismissedAuto:{...b.dismissedAuto,[todayKey]:dismissed}};
    });
    showToast(`Added "${topic.name}" to today's plan`);
  },[patchBucket,todayKey,showToast]);

  const removeManualItem = useCallback((topicId)=>{
    patchBucket(b=>({...b, dailyManual:{...b.dailyManual,[todayKey]:(b.dailyManual[todayKey]||[]).filter(m=>m.topicId!==topicId)}}));
  },[patchBucket,todayKey]);

  const dismissAutoItem = useCallback((topicId)=>{
    patchBucket(b=>{
      const set = new Set(b.dismissedAuto[todayKey]||[]); set.add(topicId);
      return {...b, dismissedAuto:{...b.dismissedAuto,[todayKey]:[...set]}};
    });
  },[patchBucket,todayKey]);

  const toggleAutoFill = useCallback(()=>{
    patchBucket(b=>{
      const cur = b.autoFillOn[todayKey] ?? true;
      return {...b, autoFillOn:{...b.autoFillOn,[todayKey]: !cur}, dismissedAuto:{...b.dismissedAuto,[todayKey]:[]}};
    });
  },[patchBucket,todayKey]);

  const setExamFocus = useCallback((patch)=>{ patchBucket(b=>({...b, examFocus:{...b.examFocus, ...patch}})); },[patchBucket]);
  const setExamDate = useCallback((date)=>{ patchBucket(b=>({...b, examDate:date})); },[patchBucket]);
  const setDailyMinutesDefault = useCallback((mins)=>{ patchBucket(b=>({...b, dailyMinutesDefault:mins})); },[patchBucket]);
  const setDisplayName = useCallback((name)=>{ patchBucket(b=>({...b, displayName:name})); },[patchBucket]);
  const resetCurrentProfile = useCallback(()=>{ patchBucket(b=> newProfileBucket(b.displayName,false)); },[patchBucket]);

  // ---- Export / Import backup ----
  const exportBackup = useCallback(()=>{
    try{
      if(!Object.keys(profilesStore).length){ showToast("Nothing to export yet."); return; }
      const json = JSON.stringify(buildBackupPayload(profilesStore,currentKey,"exportedAt"),null,2);
      const url = URL.createObjectURL(new Blob([json],{type:"application/json"}));
      const a = document.createElement("a");
      a.href = url; a.download = `studywise-backup-${localDateStamp()}.json`; a.style.display = "none";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),10000);
      try{ localStorage.setItem(LAST_EXPORT_KEY, new Date().toISOString()); }catch(e){}
      showToast("Backup exported successfully.");
    }catch(e){
      showToast("Couldn't create the backup file.",4000);
    }
  },[profilesStore,currentKey,showToast]);

  const importBackupFile = useCallback(async (file)=>{
    if(!file) return false;
    // 1) read + parse + validate everything BEFORE touching current data
    let parsed;
    try{ parsed = JSON.parse(await readFileText(file)); }
    catch(e){ showToast("Invalid or incompatible backup file.",4000); return false; }
    const r = parseBackup(parsed,true);
    if(!r.ok){
      showToast(r.error==="newer" ? "This backup was made by a newer version of StudyWise. Please update the app first."
              : r.error==="badversion" ? "Unsupported backup version."
              : "Invalid or incompatible backup file.", 4500);
      return false;
    }
    // 2) confirm
    const n = Object.keys(r.profilesStore).length;
    if(!window.confirm("This will replace your current StudyWise data with the backup. Continue?\n\n(The backup contains "+n+" profile"+(n===1?"":"s")+".)")) return false;
    // 3) replace state + save immediately
    const key = r.currentKey || ((currentKey && hasOwn(r.profilesStore,currentKey)) ? currentKey : Object.keys(r.profilesStore)[0]);
    setProfilesStore(r.profilesStore);
    setCurrentKey(key);
    setActiveTopicId(null);
    const w = writeStorage(r.profilesStore,key);
    dirtyRef.current = false;
    saveFailedRef.current = !w.ok;
    if(w.ok) showToast("Backup imported successfully.");
    else showToast("Backup imported, but this browser couldn't save it (storage may be full). Please export a backup soon.",6000);
    return true;
  },[currentKey,showToast]);

  const daysToExam = useMemo(()=>{ if(!bucket||!bucket.examDate) return null; return Math.ceil((new Date(bucket.examDate).getTime()-Date.now())/86400000); },[bucket && bucket.examDate]);
  const daysToFocusExam = useMemo(()=>{ if(!bucket||!bucket.examFocus.examDate) return null; return Math.ceil((new Date(bucket.examFocus.examDate).getTime()-Date.now())/86400000); },[bucket && bucket.examFocus && bucket.examFocus.examDate]);

  // Requirement #4: automatically return to normal planning once the focus exam date has passed.
  useEffect(()=>{
    if(bucket && bucket.examFocus.enabled && daysToFocusExam!=null && daysToFocusExam<0){
      setExamFocus({enabled:false});
      showToast("Exam Focus ended — back to your balanced plan");
    }
  },[daysToFocusExam]);

  const value = {
    subjects: bucket ? bucket.subjects : [],
    sessions: bucket ? bucket.sessions : [],
    dailyTime: bucket ? bucket.dailyTime : {},
    dailyManual: bucket ? bucket.dailyManual : {},
    dismissedAuto: bucket ? bucket.dismissedAuto : {},
    autoFillOn: bucket ? bucket.autoFillOn : {},
    examFocus: bucket ? bucket.examFocus : {enabled:false,subjectId:null,examDate:"",focusOnly:false},
    examDate: bucket ? bucket.examDate : "",
    dailyMinutesDefault: bucket ? bucket.dailyMinutesDefault : 240,
    displayName: bucket ? bucket.displayName : "",
    currentKey, todayKey, intervals, daysToExam, daysToFocusExam,
    page, setPage, activeTopicId, setActiveTopicId,
    updateTopic, updateSubjectMeta, logSession,
    setTodayMinutes, addManualTopic, removeManualItem, dismissAutoItem, toggleAutoFill,
    setExamFocus, setExamDate, setDailyMinutesDefault, setDisplayName,
    switchProfile, resetCurrentProfile,
    exportBackup, importBackupFile, profileCount:Object.keys(profilesStore).length,
    toast, showToast,
  };
  return <Ctx.Provider value={value}>{children}</Ctx.Provider>;
}

// Combines manual selections + live smart auto-fill for "today". Shared by
// the Dashboard and the Smart Planner page so both stay in sync (req. #8).
function useDayPlan(){
  const app = useApp();
  const { subjects, dailyTime, dailyMinutesDefault, dailyManual, dismissedAuto, autoFillOn, examFocus, daysToExam, intervals, todayKey } = app;
  const totalMinutes = dailyTime[todayKey] ?? dailyMinutesDefault;
  const manualEntries = dailyManual[todayKey] || [];
  const dismissedIds = dismissedAuto[todayKey] || [];
  const autoOn = autoFillOn[todayKey] ?? true;

  const manualItems = useMemo(()=>{
    const flat = allTopics(subjects);
    return manualEntries.map(m=>{
      const t = flat.find(x=>x.id===m.topicId);
      if(!t) return null;
      const subject = subjects.find(s=>s.id===t.subjectId);
      return { topic:t, subject, minutes:m.minutes, source:"manual", score:null, reason:"You added this topic to today's plan." };
    }).filter(Boolean);
  // eslint-disable-next-line
  },[JSON.stringify(manualEntries), subjects]);

  const usedByManual = manualItems.reduce((a,i)=>a+i.minutes,0);
  const remainingAfterManual = Math.max(0, totalMinutes-usedByManual);

  const autoItems = useMemo(()=>{
    if(!autoOn) return [];
    const excludeIds = new Set([...manualEntries.map(m=>m.topicId), ...dismissedIds]);
    return computeAutoFill(subjects, excludeIds, remainingAfterManual, daysToExam, intervals, examFocus);
  // eslint-disable-next-line
  },[autoOn, JSON.stringify(manualEntries), JSON.stringify(dismissedIds), remainingAfterManual, subjects, daysToExam, intervals, examFocus]);

  const usedByAuto = autoItems.reduce((a,i)=>a+i.minutes,0);
  const remainingMinutes = totalMinutes - usedByManual - usedByAuto;

  return { totalMinutes, manualItems, autoItems, usedByManual, usedByAuto, remainingMinutes, autoOn };
}

function subjectCompletion(subject){
  const flat = subject.chapters.flatMap(c=>c.topics);
  if(!flat.length) return 0;
  return Math.round(100*flat.filter(t=>t.completed).length/flat.length);
}

/* =========================================================================
   8. SMART PLANNER  (comparison + today's combined plan)
   ========================================================================= */
function Planner(){
  const app = useApp();
  const {subjects,daysToExam,intervals,examFocus,setPage,setActiveTopicId,removeManualItem,dismissAutoItem,addManualTopic} = app;
  const dayPlan = useDayPlan();
  const allPlanItems = [...dayPlan.manualItems, ...dayPlan.autoItems].sort((a,b)=>(b.score??60)-(a.score??60));

  const table = subjects.map(s=>{
    const flat = s.chapters.flatMap(c=>c.topics);
    const avgDiff = flat.length ? flat.reduce((a,t)=>a+t.difficulty,0)/flat.length : 2;
    const weakness = 5-s.confidence;
    const best = bestTopicForSubject(s, daysToExam, intervals, examFocus);
    return {
      subject:s, completion:subjectCompletion(s),
      difficultyLabel: avgDiff>=2.4?"High":avgDiff>=1.7?"Medium":"Low",
      weaknessLabel: weakness>=3?"High":weakness>=2?"Medium":"Low",
      score: best?best.score:0, best,
    };
  }).sort((a,b)=>b.score-a.score);

  return (
    <div>
      <PageHeader eyebrow="Smart Planner" title="What should I study next?" subtitle="Priority combines topic difficulty, exam importance, your self-rated weakness, pending syllabus, revision due-ness, time since you last studied a topic — and Exam Focus Mode if it's on."/>
      <div className="container" style={{maxWidth:1100,paddingBottom:60}}>
        {examFocus.enabled && (
          <div className="card anim-in focus-glow" style={{padding:"12px 18px",marginBottom:20,borderColor:"var(--coral)",display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
            <span className="pill" style={{background:"var(--coral-soft)",color:"var(--coral)"}}>🎯 Exam Focus active</span>
            <span className="faint" style={{fontSize:12.5}}>{subjects.find(s=>s.id===examFocus.subjectId)?.name} is being prioritised{examFocus.focusOnly?" exclusively":""}.</span>
          </div>
        )}

        <div className="card anim-in" style={{padding:0,overflow:"hidden",marginBottom:26}}>
          <table className="sw-table sw-lbl" style={{width:"100%",borderCollapse:"collapse",fontSize:13.5}}>
            <thead>
              <tr style={{background:"var(--paper)"}}>
                {["Subject","Syllabus","Difficulty","Weakness","Priority"].map((h,i)=>(
                  <th key={h} style={{textAlign:i===0?"left":"right",padding:"12px 18px",fontSize:11.5,color:"var(--ink-soft)",fontWeight:700,textTransform:"uppercase",letterSpacing:".03em"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {table.map(row=>(
                <tr key={row.subject.id} style={{borderTop:"1px solid var(--line)"}}>
                  <td className="sw-full" style={{padding:"13px 18px",fontWeight:700,color:row.subject.color}}>{row.subject.name}</td>
                  <td data-label="Syllabus" style={{padding:"13px 18px",textAlign:"right"}}>{row.completion}%</td>
                  <td data-label="Difficulty" style={{padding:"13px 18px",textAlign:"right"}}>{row.difficultyLabel}</td>
                  <td data-label="Weakness" style={{padding:"13px 18px",textAlign:"right"}}>{row.weaknessLabel}</td>
                  <td data-label="Priority" style={{padding:"13px 18px",textAlign:"right"}}><PriorityDot score={row.score}/></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        {table[0]?.best && (
          <div className="card anim-in" style={{padding:22,marginBottom:26,borderLeft:"4px solid var(--marigold)"}}>
            <div style={{fontSize:12,fontWeight:700,color:"var(--marigold-deep)",marginBottom:4}}>RECOMMENDED NEXT</div>
            <div style={{fontSize:20,fontWeight:700,fontFamily:"Fraunces"}}>{table[0].subject.name} → {table[0].best.topic.name}</div>
            <p className="muted" style={{margin:"8px 0 14px"}}>{table[0].best.reason}</p>
            <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
              <button className="btn btn-dark" onClick={()=>{setActiveTopicId(table[0].best.topic.id); setPage("timer");}}>Start this topic →</button>
              <button className="btn btn-ghost" onClick={()=>addManualTopic(table[0].best.topic, table[0].best.recommendedMinutes)}>+ Add to today's plan</button>
            </div>
          </div>

function SubjectDetail({subject,onStudy}){
  const {updateTopic,addManualTopic,dailyManual,todayKey,daysToExam,intervals,examFocus} = useApp();
  const [filter,setFilter] = useState("all");
  const [justCompleted,setJustCompleted] = useState(null);
  const addedIds = new Set((dailyManual[todayKey]||[]).map(m=>m.topicId));

  const byBook = useMemo(()=>{
    const map={};
    subject.chapters.forEach(c=>{ (map[c.book]=map[c.book]||[]).push(c); });
    return map;
  },[subject]);

  const filterTopic = t=>{
    if(filter==="hard-incomplete") return t.difficulty===3 && !t.completed;
    if(filter==="incomplete") return !t.completed;
    if(filter==="completed") return t.completed;
    return true;
  };

  const onCheck = (t, checked)=>{
    updateTopic(t.id,{completed:checked, lastStudied: checked ? new Date().toISOString() : t.lastStudied});
    if(checked){ setJustCompleted(t.id); setTimeout(()=>setJustCompleted(id=>id===t.id?null:id), 900); }
  };

  return (
    <div>
      <div className="card anim-in" style={{padding:20,marginBottom:20,display:"flex",gap:24,alignItems:"center",flexWrap:"wrap"}}>
        <div style={{flex:1,minWidth:200}}>
          <div style={{fontSize:12,fontWeight:700,color:subject.color}}>{subjectCompletion(subject)}% syllabus complete</div>
          <ProgressBar value={subjectCompletion(subject)} color={subject.color} height={10}/>
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {[["all","All"],["incomplete","Incomplete"],["hard-incomplete","Hard + Incomplete"],["completed","Completed"]].map(([k,l])=>(
            <button key={k} onClick={()=>setFilter(k)} className="btn btn-sm" style={{
              background:filter===k?"var(--navy)":"var(--panel)", color:filter===k?"#fff":"var(--ink)", border:"1px solid var(--line)"
            }}>{l}</button>
          ))}
        </div>
      </div>

      {Object.entries(byBook).map(([bookName,chs])=>(
        <div key={bookName} style={{marginBottom:22}}>
          <h3 style={{fontSize:15.5,color:"var(--ink-soft)",marginBottom:10}}>{bookName}</h3>
          {chs.map(ch=>{
            const topics = ch.topics.filter(filterTopic);
            if(!topics.length) return null;
            return (
              <div key={ch.name} className="card anim-in" style={{padding:"14px 18px",marginBottom:10}}>
                <div style={{fontWeight:700,fontSize:14,marginBottom:8}}>{ch.name}</div>
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {topics.map(t=>{
                    const dm=diffMeta(t.difficulty);
                    const already = addedIds.has(t.id);
                    return (
                      <div key={t.id} className={"sw-trow "+(justCompleted===t.id?"row-flash":"")} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 4px",borderTop:"1px solid var(--line)",borderRadius:8}}>
                        <span className={justCompleted===t.id?"pop":""} style={{display:"inline-flex"}}>
                          <input type="checkbox" checked={t.completed} onChange={e=>onCheck(t,e.target.checked)} className="sw-check" style={{width:16,height:16}}/>
                        </span>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:13.5,fontWeight:600,textDecoration:t.completed?"line-through":"none",color:t.completed?"var(--gray)":"var(--ink)"}}>{t.name}</div>
                          <div className="faint" style={{fontSize:11.5}}>{dm.emoji} {dm.label} · importance {impMeta(t.importance)} · ~{t.estimatedMinutes}m</div>
                        </div>
                        <button className="btn btn-sm btn-ghost" onClick={()=>onStudy(t)}>Study</button>
                        <button
                          disabled={already}
                          className="btn btn-sm"
                          style={{background: already?"var(--teal-soft)":"var(--marigold)", color: already?"var(--teal)":"var(--navy)"}}
                          onClick={()=>{ const {recommendedMinutes}=calculatePriority(t,subject,daysToExam,intervals,examFocus); addManualTopic(t, recommendedMinutes); }}

/* =========================================================================
   10. TIMER  (stopwatch + pomodoro)
   ========================================================================= */
function Timer(){
  const {subjects,activeTopicId,setActiveTopicId,logSession} = useApp();
  const flat = allTopics(subjects);
  const activeTopic = flat.find(t=>t.id===activeTopicId) || flat[0];

  const [mode,setMode] = useState("stopwatch");
  const [pomoLen,setPomoLen] = useState(25);
  const [running,setRunning] = useState(false);
  const [seconds,setSeconds] = useState(0);
  const [phase,setPhase] = useState("study");
  const intervalRef = useRef(null);

  useEffect(()=>{
    if(running){
      intervalRef.current = setInterval(()=>{
        setSeconds(s=>{
          if(mode==="pomodoro"){
            const limit = (phase==="study"?pomoLen: (pomoLen===25?5:10))*60;
            if(s+1>=limit){ setPhase(p=> p==="study"?"break":"study"); return 0; }
          }
          return s+1;
        });
      },1000);
    }
    return ()=>clearInterval(intervalRef.current);
  },[running,mode,phase,pomoLen]);

  const stop = ()=>{
    setRunning(false);
    const mins = Math.round(seconds/60);
    if(mins>0 && activeTopic){ logSession(activeTopic, activeTopic.subjectId, mins); }
    setSeconds(0);
  };

  const limit = mode==="pomodoro" ? (phase==="study"?pomoLen:(pomoLen===25?5:10))*60 : null;

  if(!activeTopic) return <div style={{padding:36}}>No topics available.</div>;

  return (
    <div>
      <PageHeader eyebrow="Study Timer" title="Focus session" subtitle="Pick a topic, choose a mode, and press start. Stopping the timer automatically saves the session to your history."/>
      <div className="container" style={{maxWidth:760,paddingBottom:60}}>
        <div className="card anim-in" style={{padding:16,marginBottom:22}}>
          <label style={{fontSize:12,fontWeight:700,color:"var(--ink-soft)"}}>Studying</label>
          <select value={activeTopic.id} onChange={e=>setActiveTopicId(e.target.value)}
            style={{display:"block",width:"100%",padding:"11px 12px",border:"1px solid var(--line)",borderRadius:10,marginTop:6,fontSize:14}}>
            {flat.map(t=><option key={t.id} value={t.id}>{t.subjectName} — {t.name}</option>)}
          </select>
        </div>

        <div style={{display:"flex",gap:8,marginBottom:22,flexWrap:"wrap"}}>
          <button className="btn btn-sm" onClick={()=>{setMode("stopwatch"); setRunning(false); setSeconds(0);}} style={{background:mode==="stopwatch"?"var(--navy)":"var(--panel)",color:mode==="stopwatch"?"#fff":"var(--ink)",border:"1px solid var(--line)"}}>Stopwatch</button>
          <button className="btn btn-sm" onClick={()=>{setMode("pomodoro"); setRunning(false); setSeconds(0); setPhase("study");}} style={{background:mode==="pomodoro"?"var(--navy)":"var(--panel)",color:mode==="pomodoro"?"#fff":"var(--ink)",border:"1px solid var(--line)"}}>Pomodoro</button>
          {mode==="pomodoro" && (
            <>
              <button className="btn btn-sm btn-ghost" onClick={()=>setPomoLen(25)} style={{opacity:pomoLen===25?1:0.5}}>25/5</button>
              <button className="btn btn-sm btn-ghost" onClick={()=>setPomoLen(50)} style={{opacity:pomoLen===50?1:0.5}}>50/10</button>
            </>
          )}
        </div>

        <div className={"card anim-in "+(running?"timer-live":"")} style={{padding:"46px 20px",textAlign:"center"}}>
          {mode==="pomodoro" && <div className="pill" style={{background: phase==="study"?"var(--teal-soft)":"var(--marigold)"+"22", color: phase==="study"?"var(--teal)":"var(--marigold-deep)",marginBottom:16}}>{phase==="study"?"● Study phase":"● Break phase"}</div>}
          <div className="sw-clock" style={{fontFamily:"Fraunces",fontSize:64,fontWeight:600,letterSpacing:"1px"}}>{fmtClock(seconds)}</div>
          {limit && <div className="faint" style={{marginTop:6,fontSize:13}}>of {fmtClock(limit)}</div>}
          <div style={{marginTop:28,display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap"}}>
            {!running ? (
              <button className="btn btn-primary" onClick={()=>setRunning(true)}>▶ Start</button>
            ) : (
              <button className="btn btn-dark" onClick={()=>setRunning(false)}>⏸ Pause</button>
            )}
            <button className="btn btn-ghost" onClick={stop}>⏹ Stop & Save</button>
            <button className="btn btn-ghost" onClick={()=>{setRunning(false); setSeconds(0);}}>↻ Reset</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* =========================================================================

function useInstall(){
  const [evt,setEvt] = useState(()=>window.__swInstallEvent||null);
  const [installed,setInstalled] = useState(()=> window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone===true);
  useEffect(()=>{
    const ready = ()=>setEvt(window.__swInstallEvent);
    const done = ()=>{ setEvt(null); setInstalled(true); };
    window.addEventListener("sw-install-ready",ready);
    window.addEventListener("sw-installed",done);
    return ()=>{ window.removeEventListener("sw-install-ready",ready); window.removeEventListener("sw-installed",done); };
  },[]);
  const install = useCallback(async ()=>{
    const e = window.__swInstallEvent; if(!e) return;
    e.prompt();
    try{ await e.userChoice; }catch(_){}
    window.__swInstallEvent = null; setEvt(null);
  },[]);
  return {canInstall:!!evt, installed, install};
}

// Small dismissible banner shown once Chrome says the app is installable.

  if(!canInstall || hidden) return null;
  const dismiss = ()=>{ setHidden(true); try{ sessionStorage.setItem("sw_install_hide","1"); }catch(e){} };

      <button aria-label="Dismiss" onClick={dismiss} style={{background:"none",border:"none",color:"#fff",opacity:.6,fontSize:20,padding:"0 4px"}}>×</button>
    </div>
  );
}

      ) : (
        <p className="faint" style={{fontSize:12.5,lineHeight:1.6,margin:0}}>
          In Chrome, tap the <b>⋮</b> menu, then <b>Install app</b> (or <b>Add to Home screen</b>). If you don't see it, open this page in Chrome itself rather than inside another app's browser.
        </p>
      )}
    </div>
  );
}

/* =========================================================================
   14. SETTINGS
   ========================================================================= */
function Settings(){
  const {displayName,setDisplayName,dailyMinutesDefault,setDailyMinutesDefault,examDate,setExamDate,resetCurrentProfile,switchProfile,showToast,exportBackup,importBackupFile,profileCount} = useApp();
  const [local,setLocal] = useState({name:displayName, dailyMinutes:dailyMinutesDefault, examDate});
  const importRef = useRef(null);
  const readLastExport = ()=>{ try{ const v=localStorage.getItem(LAST_EXPORT_KEY); return v?new Date(v):null; }catch(e){ return null; } };
  const [lastExport,setLastExport] = useState(readLastExport);
  // keep the form in step with the store (after a backup import or profile switch)
  useEffect(()=>{ setLocal({name:displayName, dailyMinutes:dailyMinutesDefault, examDate}); },[displayName,dailyMinutesDefault,examDate]);
  const [newName,setNewName] = useState("");

  return (
    <div>
      <PageHeader eyebrow="Settings" title="Preferences" subtitle="Fine-tune your plan. Changing these updates every recommendation immediately."/>
      <div className="container" style={{maxWidth:640,paddingBottom:60}}>
        <div className="card anim-in" style={{padding:22,marginBottom:18}}>
          <label style={{fontSize:12,fontWeight:700}}>Name</label>
          <input value={local.name} onChange={e=>setLocal(l=>({...l,name:e.target.value}))} style={{display:"block",width:"100%",padding:"10px 12px",border:"1px solid var(--line)",borderRadius:10,marginTop:5,marginBottom:16}}/>
          <label style={{fontSize:12,fontWeight:700}}>Usual daily study time (minutes)</label>
          <input type="number" value={local.dailyMinutes} onChange={e=>setLocal(l=>({...l,dailyMinutes:Number(e.target.value)||0}))} style={{display:"block",width:"100%",padding:"10px 12px",border:"1px solid var(--line)",borderRadius:10,marginTop:5,marginBottom:16}}/>
          <p className="faint" style={{fontSize:11.5,marginTop:-10,marginBottom:16}}>This is just your default — change today's actual available time any time from the Dashboard.</p>
          <label style={{fontSize:12,fontWeight:700}}>Board exam date</label>
          <input type="date" value={local.examDate} onChange={e=>setLocal(l=>({...l,examDate:e.target.value}))} style={{display:"block",width:"100%",padding:"10px 12px",border:"1px solid var(--line)",borderRadius:10,marginTop:5}}/>
          <button className="btn btn-primary" style={{marginTop:18}} onClick={()=>{ setDisplayName(local.name); setDailyMinutesDefault(local.dailyMinutes); setExamDate(local.examDate); showToast("Settings saved"); }}>Save changes</button>
        </div>

        <div className="card anim-in" style={{padding:22,marginBottom:18}}>
          <h3 style={{marginTop:0,fontSize:15}}>Difficulty & time source</h3>
          <p className="faint" style={{fontSize:12.5,lineHeight:1.6}}>
            Difficulty and study-time estimates shown across StudyWise are <strong>Planner Estimated</strong> values —
            CBSE does not officially publish a per-topic difficulty rating. Recommended durations are
            <strong> AI/Planner Recommended Study Time</strong>, not an official CBSE figure. Syllabus content
            is structured to the official CBSE Class XII Arts curriculum, {CBSE_SESSION} session.
          </p>
        </div>

        <div className="card anim-in" style={{padding:22,marginBottom:18}}>
          <h3 style={{marginTop:0,fontSize:15}}>Switch profile</h3>
          <p className="faint" style={{fontSize:12.5,marginBottom:10}}>Each name has its own completely separate progress, sessions and settings — nothing carries over. A new name always starts at 0%.</p>
          <div style={{display:"flex",gap:8}}>
            <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Enter a name" style={{flex:1,padding:"9px 12px",border:"1px solid var(--line)",borderRadius:10}}/>
            <button className="btn btn-sm btn-dark" disabled={!newName.trim()} onClick={()=>{switchProfile(newName); setNewName("");}}>Switch</button>
          </div>
        </div>

        <InstallCard/>

        <div className="card anim-in" style={{padding:22,marginBottom:18}}>
          <h3 style={{marginTop:0,fontSize:15}}>Data &amp; Backup</h3>
          <p className="faint" style={{fontSize:12.5,lineHeight:1.6,marginBottom:14}}>
            Save your study progress to a file so you can restore it on another phone or browser.
            The backup includes all {profileCount} profile{profileCount===1?"":"s"} on this device.
            Your progress is also saved automatically on this device as you go. If you clear this app's data or change phones, it's gone, so export a backup now and then.
          </p>
          <p style={{fontSize:12.5,fontWeight:700,marginTop:0,marginBottom:14,color:lastExport?"var(--teal)":"var(--coral)"}}>
            {lastExport ? "Last backup: "+lastExport.toLocaleString([], {day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"}) : "No backup exported yet."}
          </p>
          <div style={{display:"flex",flexWrap:"wrap",gap:10}}>
            <button className="btn btn-dark" style={{flex:"1 1 200px",justifyContent:"center",minHeight:48,padding:"12px 16px",whiteSpace:"nowrap"}} onClick={()=>{ exportBackup(); setTimeout(()=>setLastExport(readLastExport()),50); }}>⬇ Export Backup</button>
            <button className="btn btn-ghost" style={{flex:"1 1 200px",justifyContent:"center",minHeight:48,padding:"12px 16px",whiteSpace:"nowrap"}} onClick={()=>importRef.current && importRef.current.click()}>⬆ Import Backup</button>
            <input ref={importRef} type="file" style={{display:"none"}}
              onChange={e=>{ const f=e.target.files && e.target.files[0]; e.target.value=""; if(f) importBackupFile(f); }}/>
          </div>
        </div>

        <div className="card anim-in" style={{padding:22,borderColor:"var(--coral)"}}>
          <h3 style={{marginTop:0,fontSize:15}}>Reset progress</h3>
          <p className="faint" style={{fontSize:12.5}}>Clears completion, revision stages, study sessions and today's plan for this profile — back to exactly 0%.</p>
          <button className="btn btn-sm" style={{background:"var(--coral-soft)",color:"var(--coral)"}} onClick={()=>{ if(confirm("Reset all progress for this profile back to 0%?")){ resetCurrentProfile(); showToast("Progress reset to 0%"); } }}>Reset all progress</button>
        </div>
      </div>
    </div>
  );
}

/* =========================================================================
   15. ROOT
   ========================================================================= */
// Toast for the landing/setup screens (the main app shell renders its own).
function LandingToast(){
  const {toast} = useApp();
  if(!toast) return null;
  return <div className="toast-in sw-toast" style={{position:"fixed",bottom:26,right:26,maxWidth:"calc(100vw - 52px)",zIndex:60,background:"var(--navy)",color:"#fff",padding:"13px 20px",borderRadius:12,fontSize:13.5,fontWeight:600,boxShadow:"0 14px 30px -10px rgba(0,0,0,.4)"}}>{toast.msg}</div>;
}

function AppInner(){
  const {page,setPage,currentKey} = useApp();

  useEffect(()=>{
    if(!currentKey && page!=="landing" && page!=="setup") setPage("landing");
  },[currentKey,page]);

  if(page==="landing") return <><Landing/><LandingToast/></>;
  if(page==="setup") return <><Setup/><LandingToast/></>;
  if(!currentKey) return null;

  const pages = { dashboard:Dashboard, planner:Planner, subjects:Subjects, timer:Timer, progress:ProgressPage, revision:Revision, notes:Notes, settings:Settings };
  const Page = pages[page] || Dashboard;
  return <Shell><Page/></Shell>;
}

function App(){
  return <AppProvider><AppInner/><InstallBanner/></AppProvider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
